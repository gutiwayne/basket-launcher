name: Release

# Publica una versión firmada al subir una etiqueta, p. ej.: git tag v6.11.5-cesta.1 && git push origin v6.11.5-cesta.1
on:
  push:
    tags: ["v*-cesta*"]   # las etiquetas del original (v6.11.5…) no publican nada

permissions:
  contents: write

jobs:
  release:
    name: APK firmado y release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Compilar release firmado
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          CESTA_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Falta el secreto SIGNING_KEYSTORE_BASE64"; exit 1; }
          export CESTA_KEYSTORE="$RUNNER_TEMP/cesta.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$CESTA_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$CESTA_KEYSTORE"

      - name: Verificar firma
        id: apk
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          OUT="cesta-launcher-${GITHUB_REF_NAME}.apk"
          cp "$SRC" "$OUT"
          "$APKSIGNER" verify --print-certs "$OUT" | tee firma.txt
          grep -q "SHA-256 digest" firma.txt
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "cert=$(grep -m1 'SHA-256 digest' firma.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<NOTES
          **Cesta Launcher**: fork de [Olauncher](https://github.com/tanujnotes/Olauncher) (de tanujnotes, GPL-3.0) con carpetas en la pantalla de inicio.

          - Huella SHA-256 del certificado de firma: \`${{ steps.apk.outputs.cert }}\`
          - Comprueba el APK con \`${{ steps.apk.outputs.file }}.sha256\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "Cesta Launcher $GITHUB_REF_NAME" --notes-file notas.md --generate-notes
