name: Release

# Publishes a signed build when a tag is pushed, e.g.: git tag v6.11.5-basket.1 && git push origin v6.11.5-basket.1
on:
  push:
    tags: ["v*-basket*"]   # upstream tags (v6.11.5…) never publish anything
  workflow_dispatch:      # manual run: builds and verifies the signed APK, uploads it as an artifact, no release

permissions:
  contents: write

jobs:
  release:
    name: Signed APK and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          BASKET_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing secret SIGNING_KEYSTORE_BASE64"; exit 1; }
          export BASKET_KEYSTORE="$RUNNER_TEMP/basket.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$BASKET_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$BASKET_KEYSTORE"

      - name: Verify signature
        id: apk
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then OUT="basket-launcher-${GITHUB_REF_NAME}.apk"; else OUT="basket-launcher-${GITHUB_SHA::7}.apk"; fi
          cp "$SRC" "$OUT"
          "$APKSIGNER" verify --print-certs "$OUT" | tee signature.txt
          grep -q "SHA-256 digest" signature.txt
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "cert=$(grep -m1 'SHA-256 digest' signature.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: basket-release-apk
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          retention-days: 14

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **Basket Launcher**: a fork of [Olauncher](https://github.com/tanujnotes/Olauncher) by tanujnotes (GPL-3.0) with swipeable app lists and settings backup.

          - Signing certificate SHA-256 fingerprint: \`${{ steps.apk.outputs.cert }}\`
          - Verify the APK with \`${{ steps.apk.outputs.file }}.sha256\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "Basket Launcher $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
