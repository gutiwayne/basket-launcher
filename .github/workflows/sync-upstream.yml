name: Sync with Olauncher

# Every Monday: master = exact mirror of upstream; merged into carpetas, tested and pushed.
# On conflict or test failure nothing is pushed and an issue is opened (GitHub notifies you).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: carpetas
          fetch-depth: 0

      - name: Fetch upstream
        id: fetch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tanujnotes/Olauncher.git
          git fetch --no-tags upstream master
          git fetch --no-tags origin master
          echo "new=$(git rev-list --count origin/master..upstream/master)" >> "$GITHUB_OUTPUT"

      - name: Update master (fast-forward only)
        if: steps.fetch.outputs.new != '0'
        run: git push origin upstream/master:refs/heads/master

      - name: Merge into carpetas
        id: merge
        if: steps.fetch.outputs.new != '0'
        run: |
          if git merge --no-edit upstream/master -m "Merge Olauncher upstream ($(git rev-parse --short upstream/master))"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.merge.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.merge.outputs.ok == 'true'

      - name: Test the merge
        id: test
        if: steps.merge.outputs.ok == 'true'
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Push carpetas
        if: steps.merge.outputs.ok == 'true' && steps.test.outcome == 'success'
        run: git push origin HEAD:carpetas

      - name: Report when manual action is needed
        if: failure() || steps.merge.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly sync with Olauncher needs attention."
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -s conflicts.txt ]; then echo "- Conflicts in:"; sed 's/^/  - `/; s/$/`/' conflicts.txt; else echo "- Reason: build or tests fail after merging."; fi
            echo
            echo "Nothing was pushed to \`carpetas\`. \`master\` is already up to date with upstream."
          } > issue.md
          gh issue create --title "Olauncher sync: needs review ($(date +%F))" --body-file issue.md \
            || echo "::warning::Could not open an issue (Issues disabled on the fork?). GitHub still emails you about the failed run."
          exit 1
