name: Sincronizar con Olauncher

# Cada lunes: master = copia exacta del original; se fusiona en carpetas, se prueba y se sube.
# Si hay conflicto o fallan los tests, no se sube nada y se abre una issue (GitHub te avisa).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: carpetas
          fetch-depth: 0

      - name: Traer el original
        id: fetch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tanujnotes/Olauncher.git
          git fetch --no-tags upstream master
          git fetch --no-tags origin master
          echo "new=$(git rev-list --count origin/master..upstream/master)" >> "$GITHUB_OUTPUT"

      - name: Actualizar master (solo avance rápido)
        if: steps.fetch.outputs.new != '0'
        run: git push origin upstream/master:refs/heads/master

      - name: Fusionar en carpetas
        id: merge
        if: steps.fetch.outputs.new != '0'
        run: |
          if git merge --no-edit upstream/master -m "Merge Olauncher upstream ($(git rev-parse --short upstream/master))"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflictos.txt
            git merge --abort
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.merge.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.merge.outputs.ok == 'true'

      - name: Probar la fusión
        id: test
        if: steps.merge.outputs.ok == 'true'
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Subir carpetas
        if: steps.merge.outputs.ok == 'true' && steps.test.outcome == 'success'
        run: git push origin HEAD:carpetas

      - name: Avisar si hay que intervenir
        if: failure() || steps.merge.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "La sincronización semanal con Olauncher necesita revisión."
            echo
            echo "- Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -s conflictos.txt ]; then echo "- Conflictos en:"; sed 's/^/  - `/; s/$/`/' conflictos.txt; else echo "- Motivo: fallan los tests o la compilación tras fusionar."; fi
            echo
            echo "No se ha subido nada a \`carpetas\`. \`master\` ya está al día con el original."
          } > issue.md
          gh issue create --title "Sincronización con Olauncher: revisar ($(date +%F))" --body-file issue.md \
            || echo "::warning::No se pudo abrir la issue (¿Issues desactivadas en el fork?). GitHub avisa igualmente del fallo por email."
          exit 1
