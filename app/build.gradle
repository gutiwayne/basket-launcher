apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "app.olauncher"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 117
        versionName "v6.11.5"

        resourceConfigurations += ["en", "ar", "cs", "da", "de", "el", "es-rES", "es-rUS", "fa", "fi", "fr", "iw", "hi", "hr", "hu", "in", "it", "ja", "ko", "nb", "nl", "pl", "pt-rBR", "ro", "ru-rRU", "sv", "th", "tr", "uk", "vi", "zh", "zh-rTW"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
    namespace 'app.olauncher'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Work Manager
    implementation libs.work.runtime.ktx

    //Material dependency
    implementation libs.material

    testImplementation libs.junit
}

// --- Cesta Launcher (fork of Olauncher by tanujnotes) ---
// Fork-specific changes live in a separate block so upstream merges do not conflict.
android {
    defaultConfig {
        applicationId "io.github.jesusg703.cesta"
        versionNameSuffix "-cesta"
    }
    lint {
        // Issues already present upstream; CI fails only on new ones.
        baseline = file("lint-baseline.xml")
    }
    // Release signing: CI only (release.yml), using the keystore stored as a secret.
    def cestaKeystore = System.getenv("CESTA_KEYSTORE")
    if (cestaKeystore) {
        signingConfigs {
            cesta {
                storeFile file(cestaKeystore)
                storePassword System.getenv("CESTA_KEYSTORE_PASSWORD")
                keyAlias "cesta"
                keyPassword System.getenv("CESTA_KEYSTORE_PASSWORD")
                storeType "pkcs12"
            }
        }
        buildTypes.release.signingConfig signingConfigs.cesta
    }
}

dependencies {
    // Real org.json implementation for the folder JVM tests (android.jar only ships a stub).
    testImplementation "org.json:json:20260814"
    // Emulator reboot test (CI)
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
}
